<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>پنل مدیریت ویولت</title>
  <link rel="icon" href="../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">

<!-- ================= login ================= -->
<section class="login" id="login">
  <form class="login-card" id="loginForm" novalidate>
    <div class="brand"><span class="mark" id="loginMark"></span><div><b>Violet</b><small>پنل مدیریت فروشگاه</small></div></div>
    <h1>ورود مدیر</h1>
    <div class="field"><label for="lgUser">نام کاربری</label><input class="input" id="lgUser" autocomplete="username" style="direction:ltr;text-align:left" autofocus></div>
    <div class="field"><label for="lgPass">رمز عبور</label><input class="input" id="lgPass" type="password" autocomplete="current-password" style="direction:ltr;text-align:left"></div>
    <div class="login-err" id="loginErr" role="alert"></div>
    <button class="btn btn-primary btn-lg btn-block" type="submit">ورود به پنل</button>
    <div class="login-hint" id="loginHint">نام کاربری پیش‌فرض: <b>admin</b> — رمز پیش‌فرض: <b>admin123</b><br>بعد از اولین ورود حتماً از بخش «امنیت و پشتیبان» رمز را تغییر دهید.</div>
    <a class="muted" href="../index.html" style="text-align:center;font-size:.88rem">← بازگشت به فروشگاه</a>
  </form>
</section>

<!-- ================= app shell ================= -->
<div class="shell hidden" id="shell">
  <aside class="side" id="side" aria-label="منوی مدیریت">
    <div class="brand"><span class="mark" id="sideMark"></span><div><b>Violet</b><small>پنل مدیریت</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <a class="btn btn-sm" href="../index.html" target="_blank" rel="noopener" id="viewSite"></a>
      <button class="btn btn-sm btn-ghost" id="logoutBtn"></button>
    </div>
  </aside>
  <div class="side-bg" id="sideBg"></div>

  <div class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="باز کردن منو"></button>
      <h1 id="pageTitle">داشبورد</h1>
      <button class="icon-btn" id="themeBtn" aria-label="تغییر تم"></button>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalHost"></div>

<!-- core (shared with the storefront) -->
<script src="../js/core/utils.js"></script>
<script src="../js/core/icons.js"></script>
<script src="../js/core/defaults.js"></script>
<script src="../js/core/watch-svg.js"></script>
<script src="../js/core/products-data.js"></script>
<script src="../js/core/db.js"></script>
<!-- admin -->
<script src="js/core.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/products.js"></script>
<script src="js/product-editor.js"></script>
<script src="js/orders.js"></script>
<script src="js/catalog.js"></script>
<script src="js/engage.js"></script>
<script src="js/settings.js"></script>
<script src="js/settings-content.js"></script>
<script src="js/system.js"></script>
<script src="js/app.js"></script>
</body>
</html>
